<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ЭтоBalon batch</title><script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script><style>body{font:16px Arial;margin:24px;background:#f4f6f8;color:#111}button{font-size:18px;padding:14px 22px;border:0;border-radius:10px;background:#07f;color:#fff}pre,textarea{width:96%;background:#fff;padding:14px;border-radius:10px;white-space:pre-wrap}textarea{height:180px;margin-top:12px}</style></head><body><h2>ЭтоBalon — подготовка публикаций VK</h2><p>Загрузит изображения как photo, исправит первый пост и поставит остальные в отложенные.</p><button id="go">Запустить обработку</button><pre id="log">Готово.</pre><textarea id="result"></textarea><script>
const APP_ID=54775339,GROUP_ID=238465684,V='5.199',BASE='https://hardware-syndicate-station-hazards.trycloudflare.com/';
const bridge=window.vkBridge&&(window.vkBridge.default||window.vkBridge),log=document.getElementById('log'),result=document.getElementById('result');function add(s){log.textContent+='\n'+s}async function call(m,t,p={}){const r=await bridge.send('VKWebAppCallAPIMethod',{method:m,params:{...p,access_token:t,v:V}});return r&&r.response}
async function uploadOne(item,t){add('Фото: '+item.id);const up=await call('photos.getWallUploadServer',t,{group_id:GROUP_ID});const blob=await (await fetch(BASE+item.image_url,{cache:'no-store'})).blob();const fd=new FormData();fd.append('photo',blob,'creative.png');const sent=await (await fetch(up.upload_url,{method:'POST',body:fd})).json();const saved=await call('photos.saveWallPhoto',t,{group_id:GROUP_ID,photo:sent.photo,server:sent.server,hash:sent.hash});const p=saved[0],a=p.access_key?'_'+p.access_key:'';return `photo${p.owner_id}_${p.id}${a}`}
async function run(){document.getElementById('go').disabled=true;log.textContent='Инициализация…';result.value='';const done=[];try{await bridge.send('VKWebAppInit');const auth=await bridge.send('VKWebAppGetAuthToken',{app_id:APP_ID,scope:'photos,wall,groups'}),t=auth.access_token;if(!t)throw Error('Нет user token');const posts=await (await fetch(BASE+'posts.json',{cache:'no-store'})).json();add('Материалов: '+posts.length);const media={};for(const p of posts){media[p.id]=await uploadOne(p,t);done.push({id:p.id,media:media[p.id]})}add('Все фото загружены.');const wall=await call('wall.get',t,{owner_id:-GROUP_ID,count:50});const first=posts[0],dups=(wall.items||[]).filter(x=>(x.text||'').trim()===first.message.trim());if(!dups.length)throw Error('Первый пост не найден');dups.sort((a,b)=>b.id-a.id);const keep=dups[0];await call('wall.edit',t,{owner_id:-GROUP_ID,post_id:keep.id,from_group:1,message:first.message,attachments:media[first.id]});add('Первый пост исправлен: '+keep.id);for(const x of dups.slice(1)){try{await call('wall.delete',t,{owner_id:-GROUP_ID,post_id:x.id});add('Удалён дубль: '+x.id)}catch(e){add('Не удалён дубль '+x.id)}}done[0].post_id=keep.id;done[0].state='posted';done[0].posted_at=Math.floor(Date.now()/1000);const postponed=await call('wall.get',t,{owner_id:-GROUP_ID,count:100,filter:'postponed'}),existing=postponed.items||[],now=Math.floor(Date.now()/1000);for(const p of posts.slice(1)){let ex=existing.find(x=>(x.text||'').trim()===p.message.trim()),pid;if(ex){pid=ex.id;add('Уже запланирован: '+p.id)}else{const when=Math.max(Number(p.scheduled_for),now+300),r=await call('wall.post',t,{owner_id:-GROUP_ID,from_group:1,message:p.message,attachments:media[p.id],publish_date:when});pid=r.post_id;add('Запланирован: '+p.id+' → '+pid)}const row=done.find(x=>x.id===p.id);row.post_id=pid;row.state='posted';row.posted_at=now}result.value=JSON.stringify(done);add('ГОТОВО: '+done.length+' публикаций.')}catch(e){add('ОШИБКА: '+(e.message||String(e)));document.getElementById('go').disabled=false}}
document.getElementById('go').onclick=run;bridge&&bridge.send('VKWebAppInit').catch(()=>{});
</script></body></html>
